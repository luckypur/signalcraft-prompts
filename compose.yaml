services:
  api:
    build: .
    ports: ["8011:8000"]
    environment:
      DB_PATH: /app/data/signalcraft.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - signalcraft_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  signalcraft_data:
