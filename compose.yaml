services:
  api:
    build: .
    ports: ["8011:8000"]
    environment:
      DB_PATH: /app/data/signalcraft.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      ALLOW_OFFLINE_FALLBACK: ${ALLOW_OFFLINE_FALLBACK:-false}
    volumes:
      - signalcraft_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  signalcraft_data:
